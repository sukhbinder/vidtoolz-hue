[project]
name = "vidtoolz-hue"
version = "0.1.0"
description = "Add a hue to a video using ffmpeg"
readme = "README.md"
authors = [{name = "sukhbinder singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-hue"
Changelog = "https://github.com/sukhbinder/vidtoolz-hue/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-hue/issues"
CI = "https://github.com/sukhbinder/vidtoolz-hue/actions"

[project.entry-points."vidtoolz_plugins"]
hue = "vidtoolz_hue:hue_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
